
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: white;
  font-family: Arial, sans-serif;
  color: black;
  overflow: hidden;
}

main {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 28px;
  font-weight: normal;
  margin-bottom: 25px;
}

.gif {
  width: 200px;
  max-height: 200px;
  object-fit: contain;
  margin-bottom: 25px;
}

.buttons {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

button {
  padding: 10px 22px;
  font-size: 16px;
  border: 1px solid #888;
  border-radius: 3px;
  background: #eee;
  color: black;
  cursor: pointer;
  touch-action: manipulation;
}

#no {
  position: relative;
}

#second {
  display: none;
}

#tiny {
  display: none;
  position: fixed;
  bottom: 12px;
  width: 100%;
  text-align: center;
  font-size: 12px;
}

.confetti {
  position: fixed;
  top: -10px;
  width: 7px;
  height: 10px;
  animation: fall 1.8s linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translateY(105vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<main id="first">
  <h1>Will you be my girlfriend?</h1>

  <img class="gif" src="HERE" alt="">

  <div class="buttons" id="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
</main>

<div id="tiny">Idc if it's unfair🙄</div>

<main id="second">
  <h1>I LOVE YOU YASO</h1>

  <img class="gif" src="HERE" alt="">
</main>

<script>
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const buttons = document.getElementById("buttons");

let presses = 0;
let yesMode = false;

function moveNo() {
  const margin = 12;
  const w = no.offsetWidth;
  const h = no.offsetHeight;
  const yesRect = yes.getBoundingClientRect();

  let x, y, attempts = 0;

  do {
    x = margin + Math.random() * Math.max(0, window.innerWidth - w - margin * 2);
    y = margin + Math.random() * Math.max(0, window.innerHeight - h - margin * 2);
    attempts++;
  } while (
    attempts < 100 &&
    x < yesRect.right + 12 &&
    x + w > yesRect.left - 12 &&
    y < yesRect.bottom + 12 &&
    y + h > yesRect.top - 12
  );

  no.style.position = "fixed";
  no.style.left = x + "px";
  no.style.top = y + "px";
}

no.addEventListener("click", () => {
  if (yesMode) {
    showLove();
    return;
  }

  presses++;

  if (presses >= 10) {
    yesMode = true;

    no.style.position = "static";
    no.style.left = "";
    no.style.top = "";
    no.style.transform = "";

    buttons.style.flexDirection = "row";

    yes.textContent = "Yes";
    no.textContent = "Yes";

    document.getElementById("tiny").style.display = "block";
  } else {
    moveNo();
  }
});

yes.addEventListener("click", showLove);

function showLove() {
  document.getElementById("first").style.display = "none";
  document.getElementById("tiny").style.display = "none";
  document.getElementById("second").style.display = "flex";

  for (let i = 0; i < 70; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.backgroundColor = [
      "#b9a8f5", "#e8bce8", "#ffffff",
      "#d5c8ff", "#f6cce0"
    ][Math.floor(Math.random() * 5)];
    piece.style.animationDelay = Math.random() * 0.5 + "s";
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 2500);
  }
}

window.addEventListener("resize", () => {
  if (no.style.position === "fixed" && !yesMode) moveNo();
});
</script>

</body>
</html>
